<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 노래방</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:#fff;
}

/* =======================
   공통
======================= */

.screen{
    width:100vw;
    height:100vh;
    display:none;
}

.screen.active{
    display:flex;
}

/* =======================
   키오스크
======================= */

.kiosk-wrap{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#ececec,transparent 30%),
    radial-gradient(circle at bottom right,#dcdcdc,transparent 30%);
}

.kiosk{
    width:520px;
    height:820px;
    background:white;
    border-radius:45px;
    padding:25px;
    box-shadow:
    0 30px 80px rgba(0,0,0,0.15),
    inset 0 0 0 10px #ececec;
    display:flex;
    flex-direction:column;
}

.kiosk-top{
    width:120px;
    height:10px;
    background:#ddd;
    border-radius:999px;
    margin:auto;
    margin-bottom:20px;
}

.title{
    font-size:34px;
    font-weight:800;
    color:#111;
}

.sub{
    color:#888;
    margin-top:10px;
}

.room-map{
    flex:1;
    margin-top:20px;
    background:#f5f5f5;
    border-radius:35px;
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.room{
    background:white;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.room:hover{
    transform:translateY(-3px);
}

.room.selected{
    background:#111;
    color:white;
}

.option-section{
    margin-top:20px;
}

.option-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:15px;
}

.remain-box{
    position:absolute;
    top:20px;
    right:25px;
    z-index:20;

    padding:14px 22px;

    border-radius:18px;

    background:rgba(0,0,0,0.55);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    font-size:18px;
    font-weight:700;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.3);
}

.option-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option-btn{
    height:75px;
    border:none;
    border-radius:25px;
    background:#f5f5f5;
    font-size:25px;
    font-weight:700;
    cursor:pointer;
}

.option-btn.selected{
    background:#111;
    color:white;
}

.next-btn{
    margin-top:25px;
    height:70px;
    border:none;
    border-radius:25px;
    background:#111;
    color:white;
    font-size:28px;
    font-weight:800;
    cursor:pointer;
}

/* =======================
   노래방
======================= */

.karaoke-screen{
    width:100%;
    height:100%;
    position:relative;
    background:
    radial-gradient(circle at center,#222 0%,#000 70%);
    overflow:hidden;
}

/* 미러볼 빛 */

.light{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.25;
    animation:spin 8s linear infinite;
}

.light1{
    background:#00aaff;
    top:-200px;
    left:-100px;
}

.light2{
    background:#ff00ff;
    bottom:-250px;
    right:-150px;
    animation-direction:reverse;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* TV */

.tv-wrap{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    z-index:5;
}

.tv{
    width:1200px;
    height:700px;
    background:#111;
    border-radius:40px;
    padding:25px;
    box-shadow:
    0 0 40px rgba(255,255,255,0.1);
    border:10px solid #222;
    position:relative;
}

.tv-screen{
    width:100%;
    height:100%;
    background:black;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    
}


.lyrics-box{
    position:absolute;

    left:50%;
    bottom:70px;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    font-size:42px;
    font-weight:800;

    color:white;

    text-shadow:
    0 4px 20px rgba(0,0,0,0.8);

    z-index:30;

    pointer-events:none;

    transition:0.2s;
}
/* 메뉴 */

.menu{
    position:absolute;
    top:25px;
    left:25px;
    right:25px;
    display:flex;
    gap:15px;
    z-index:10;
}

.menu-btn{
    padding:15px 25px;
    border-radius:18px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
    cursor:pointer;
    font-size:18px;
    font-weight:700;
}

/* 곡 리스트 */

.song-list{
    position:absolute;
    top:90px;
    left:25px;
    right:25px;
    bottom:25px;
    overflow:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding-right:10px;
}

.song{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
    color:white;
    cursor:pointer;
    transition:0.2s;
    border:1px solid rgba(255,255,255,0.08);
}

.song:hover{
    transform:scale(1.02);
    background:rgba(255,255,255,0.12);
}

.song-title{
    font-size:24px;
    font-weight:700;
}

.song-artist{
    margin-top:8px;
    color:#bbb;
}

.ending-screen{
    position:absolute;
    inset:0;
    z-index:50;

    background:
    radial-gradient(circle at center,#222,#000);

    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    color:white;
}

.ending-title{
    font-size:70px;
    font-weight:900;
}

.ending-sub{
    margin-top:15px;
    font-size:26px;
    color:#aaa;
}

.ending-list{
    margin-top:40px;

    width:700px;
    max-height:400px;

    overflow:auto;
}

.ending-item{
    background:rgba(255,255,255,0.08);

    padding:20px 25px;

    border-radius:20px;

    margin-bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:28px;
}
/* 검색 */

.remote{
    margin-top:25px;
    display:flex;
    gap:15px;
}

.remote button{
    width:220px;
    height:70px;
    border:none;
    border-radius:20px;
    background:#1f1f1f;
    color:white;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
}

/* 영상 */

/* 점수 */

.score-screen{
    position:absolute;
    inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:30;
}

.score-title{
    font-size:40px;
    color:#aaa;
}

.score{
    font-size:180px;
    font-weight:900;
    margin-top:20px;
}


#player{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:35px;

    background:black;

    z-index:1;
}

</style>

function selectRoom(el){

    document.querySelectorAll(".room")
    .forEach(r=>r.classList.remove("selected"));

    el.classList.add("selected");
}

document.querySelectorAll(".option-btn")
.forEach(btn=>{

    btn.onclick = ()=>{

        document.querySelectorAll(".option-btn")
        .forEach(b=>b.classList.remove("selected"));

        btn.classList.add("selected");

        const text = btn.innerText;

        selectedMode = text;

        remainValue = text;
    };
});

function enterKaraoke(){

    document.getElementById("kioskScreen")
    .classList.remove("active");

    document.getElementById("karaokeScreen")
    .classList.add("active");

    showCategory("인기");
    updateRemainUI();

    startRemainSystem();
}

function showCategory(category){

    const list =
        document.getElementById("songList");

    list.style.display = "grid";

    list.innerHTML = "";

    songs
    .filter(song=>song.category===category)
    .forEach(song=>{

        list.innerHTML += `
            <div class="song"
                onclick="playSong('${song.video}','${song.title}')">

                <div class="song-title">
                    ${song.title}
                </div>

                <div class="song-artist">
                    ${song.artist}
                </div>

            </div>
        `;
    });
}

function searchSong(){

    const keyword =
        prompt("검색어 입력");

    if(!keyword) return;

    const result =
        songs.filter(song=>

            song.title.toLowerCase()
            .includes(keyword.toLowerCase())

            ||

            song.artist.toLowerCase()
            .includes(keyword.toLowerCase())
        );

    const list =
        document.getElementById("songList");

    list.innerHTML = "";

    result.forEach(song=>{

        list.innerHTML += `
            <div class="song"
                onclick="playSong('${song.video}','${song.title}')">

                <div class="song-title">
                    ${song.title}
                </div>

                <div class="song-artist">
                    ${song.artist}
                </div>

            </div>
        `;
    });
}

function playSong(video, title="알 수 없음"){

    const song =
        songs.find(s=>s.title===title);

    currentSongData = song;

    playedSongs.push({
        title,
        score:0
    });

    const player =
        document.getElementById("player");

    const list =
        document.getElementById("songList");

    const lyricsBox =
        document.getElementById("lyricsBox");

    // 리스트 숨김

    list.style.display = "none";

    // 영상 표시

    player.style.display = "block";

    // 영상 로드

    player.src = video;

    player.currentTime = 0;

    // 재생

    player.play();

    // 가사 초기화

    lyricsBox.innerText = "";

    // 가사 시작

    startLyrics();

    // 영상 끝

    player.onended = ()=>{

        clearInterval(lyricsInterval);

        lyricsBox.innerText = "";

        showScore();
    };
}

        Math.floor(Math.random()*21)+80;
    
    if(playedSongs.length > 0){

        playedSongs[
            playedSongs.length - 1
        ].score = score;
    }

    const scoreScreen =
        document.getElementById("scoreScreen");

    document.getElementById("scoreText")
    .innerText = score;

    scoreScreen.style.display = "flex";

    setTimeout(()=>{
        // 곡수 모드면 감소

        if(
            selectedMode.includes("곡")
        ){

            remainValue--;

            updateRemainUI();

            if(remainValue <= 0){

                showEndingScreen();
            }
        }
        scoreScreen.style.display = "none";

        showCategory("인기");

    },3000);
}
function updateRemainUI(){

    const box =
        document.getElementById("remainBox");

    if(!selectedMode){

        box.innerText = "선택 없음";
        return;
    }

    // 시간제

    if(
        selectedMode.includes("분")
        ||
        selectedMode.includes("시간")
    ){

        box.innerText =
            `⏰ 남은 시간 : ${remainValue}`;
    }

    // 곡수

    else{

        box.innerText =
            `🎵 남은 곡 : ${remainValue}`;
    }
}

function startRemainSystem(){

    clearInterval(remainTimer);

    // 시간제

    if(
        selectedMode.includes("분")
        ||
        selectedMode.includes("시간")
    ){

        let totalMinutes = 0;

        if(selectedMode==="10분") totalMinutes=10;
        if(selectedMode==="30분") totalMinutes=30;
        if(selectedMode==="1시간") totalMinutes=60;
        if(selectedMode==="2시간") totalMinutes=120;

        remainTimer = setInterval(()=>{

            totalMinutes--;

            if(totalMinutes <= 0){

                clearInterval(remainTimer);

                alert("이용 시간이 종료되었습니다");
                return;
            }

            remainValue = `${totalMinutes}분`;

            updateRemainUI();

        },60000);
    }

    // 곡수

    else{

        remainValue =
            parseInt(selectedMode);

        updateRemainUI();
    }
}

function showEndingScreen(){

    const ending =
        document.getElementById("endingScreen");

    const list =
        document.getElementById("endingList");

    list.innerHTML = "";

    playedSongs.forEach(song=>{

        list.innerHTML += `

            <div class="ending-item">

                <div>
                    🎵 ${song.title}
                </div>

                <div>
                    ${song.score}점
                </div>

            </div>
        `;
    });

    ending.style.display = "flex";

    // 30초 뒤 초기화

    setTimeout(()=>{

        location.reload();

    },30000);
}
function startLyrics(){

    clearInterval(lyricsInterval);

    const player =
        document.getElementById("player");

    const box =
        document.getElementById("lyricsBox");

    lyricsInterval = setInterval(()=>{

        if(!currentSongData) return;

        const current =
            player.currentTime;

        let currentText = "";

        currentSongData.lyrics.forEach(line=>{

            if(current >= line.time){

                currentText = line.text;
            }
        });

        box.innerText = currentText;

    },100);
}
</script>
